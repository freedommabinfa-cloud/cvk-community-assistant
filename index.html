<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVK Community Assistant</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for running the app directly in browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#1B2A4A] text-[#F4EFE3] m-0 p-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
        const MODEL = "llama-3.1-8b-instant";

        const ASSISTANT_SYSTEM_PROMPT = `You are the CVK Community Assistant, built for Community-Verified KYC, an initiative in Langtang South, Plateau State, Nigeria. CVK turns the trust that community leaders (traditional rulers, cooperative chairmen, development committees) already extend to farmers into a digital identity-verification record, so unbanked farmers who lack formal documents can still access digital financial services.

Explain CVK in short, plain, warm sentences. Assume the person you're talking to may have limited English or limited familiarity with digital finance. Avoid jargon. If asked something outside CVK's scope, say so honestly and briefly.`;

        const ATTESTATION_SYSTEM_PROMPT = `You are the CVK Attestation Assistant. A community leader (an "attestor" — for example the Galadima of Mabudi, the Ponzhi Mabudi, or a Development Chairman) is describing, in their own words, that they vouch for a farmer's identity so that farmer can access digital financial services under the CVK model.

Have a short, warm, natural conversation to gather exactly these fields:
- farmer_name
- farmer_community (village/ward)
- attestor_name
- attestor_role (their title or position)
- relationship (how the attestor knows this person / basis for vouching, e.g. "cooperative member for 6 years")
- date (use today's date if not specified)

Ask only one or two questions at a time, in plain language. Once you have all fields, respond with a short confirmation sentence, THEN output the completed record as a fenced JSON block, exactly like this, on its own:

\`\`\`json
{"farmer_name": "...", "farmer_community": "...", "attestor_name": "...", "attestor_role": "...", "relationship": "...", "date": "..."}
\`\`\`

Only output the JSON block once all fields are known. Never invent information — leave a field as null and keep asking if something is missing.`;

        function extractRecord(text) {
            const match = text.match(/```json\s*([\s\S]*?)```/);
            if (!match) return null;
            try { return JSON.parse(match[1]); } catch { return null; }
        }

        function stripRecordBlock(text) {
            return text.replace(/```json\s*[\s\S]*?```/, "").trim();
        }

        function App() {
            const [apiKey, setApiKey] = useState("");
            const [keyConfirmed, setKeyConfirmed] = useState(false);
            const [mode, setMode] = useState("assistant");
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [record, setRecord] = useState(null);
            const scrollRef = useRef(null);

            useEffect(() => {
                scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
            }, [messages, loading]);

            function resetConversation(newMode) {
                setMode(newMode);
                setMessages([]);
                setRecord(null);
                setError("");
            }

            async function sendMessage() {
                if (!input.trim() || loading) return;
                const systemPrompt = mode === "assistant" ? ASSISTANT_SYSTEM_PROMPT : ATTESTATION_SYSTEM_PROMPT;
                const nextMessages = [...messages, { role: "user", content: input.trim() }];
                setMessages(nextMessages);
                setInput("");
                setLoading(true);
                setError("");

                try {
                    const res = await fetch(GROQ_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: MODEL,
                            messages: [{ role: "system", content: systemPrompt }, ...nextMessages],
                            temperature: 0.4,
                        }),
                    });

                    if (!res.ok) {
                        const body = await res.text();
                        throw new Error(`Groq API returned ${res.status}: ${body.slice(0, 200)}`);
                    }

                    const data = await res.json();
                    const reply = data?.choices?.[0]?.message?.content ?? "";
                    const foundRecord = extractRecord(reply);
                    if (foundRecord) setRecord(foundRecord);
                    const displayReply = foundRecord ? stripRecordBlock(reply) : reply;

                    setMessages((prev) => [...prev, { role: "assistant", content: displayReply || "(no response text)" }]);
                } catch (e) {
                    setError(e.message.includes("Failed to fetch") ? "Could not reach Groq's API. This may be a CORS restriction." : e.message);
                } finally {
                    setLoading(false);
                }
            }

            return (
                <div className="min-h-screen w-full bg-[#1B2A4A] text-[#F4EFE3] flex flex-col font-sans">
                    <header className="border-b border-[#3A4D73] px-6 py-5 flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-md bg-[#C99A3E] flex items-center justify-center flex-shrink-0 text-[#1B2A4A] font-bold">CVK</div>
                            <div>
                                <h1 className="font-semibold text-lg tracking-tight leading-none">CVK Community Assistant</h1>
                                <p className="text-[#9FB0CE] text-xs mt-1">Community-Verified KYC · Langtang South, Plateau State</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 text-xs text-[#C99A3E] bg-[#25365C] border border-[#3A4D73] rounded-full px-3 py-1.5">
                            <span>Running on Llama 3.3 70B via Groq</span>
                        </div>
                    </header>

                    {!keyConfirmed ? (
                        <div className="flex-1 flex items-center justify-center px-6">
                            <div className="max-w-md w-full bg-[#25365C] border border-[#3A4D73] rounded-xl p-6 shadow-xl">
                                <h2 className="font-semibold mb-2 text-base">Enter your Groq API key</h2>
                                <p className="text-sm text-[#9FB0CE] mb-4 leading-relaxed">
                                    Get a free key at <span className="text-[#C99A3E]">console.groq.com</span>. It stays secure in your browser session.
                                </p>
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    placeholder="gsk_..."
                                    className="w-full bg-[#1B2A4A] border border-[#3A4D73] rounded-md px-3 py-2.5 text-sm outline-none focus:border-[#C99A3E]"
                                    onKeyDown={(e) => e.key === "Enter" && apiKey.trim() && setKeyConfirmed(true)}
                                />
                                <button
                                    onClick={() => apiKey.trim() && setKeyConfirmed(true)}
                                    disabled={!apiKey.trim()}
                                    className="w-full mt-3 bg-[#C99A3E] text-[#1B2A4A] font-semibold rounded-md py-2.5 text-sm disabled:opacity-40 hover:bg-[#DBAE55]"
                                >
                                    Start Assistant
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                            <div className="flex-1 flex flex-col min-w-0 border-r border-[#3A4D73]">
                                <div className="flex gap-2 px-6 pt-4">
                                    <button
                                        onClick={() => resetConversation("assistant")}
                                        className={`text-sm px-3 py-1.5 rounded-md border transition-colors ${mode === "assistant" ? "bg-[#C99A3E] text-[#1B2A4A] border-[#C99A3E] font-medium" : "border-[#3A4D73] text-[#9FB0CE]"}`}
                                    >
                                        Ask about CVK
                                    </button>
                                    <button
                                        onClick={() => resetConversation("attestation")}
                                        className={`text-sm px-3 py-1.5 rounded-md border transition-colors ${mode === "attestation" ? "bg-[#C99A3E] text-[#1B2A4A] border-[#C99A3E] font-medium" : "border-[#3A4D73] text-[#9FB0CE]"}`}
                                    >
                                        Log an attestation
                                    </button>
                                </div>

                                <div ref={scrollRef} className="flex-1 overflow-y-auto px-6 py-4 space-y-3">
                                    {messages.length === 0 && (
                                        <div className="text-[#5C6E8F] text-sm italic mt-4">
                                            {mode === "assistant" ? 'Try: "What is CVK and how does it help farmers?"' : 'Try: "I want to vouch for a farmer in my community."'}
                                        </div>
                                    )}
                                    {messages.map((m, i) => (
                                        <div key={i} className={`max-w-[85%] rounded-lg px-3.5 py-2.5 text-sm leading-relaxed ${m.role === "user" ? "bg-[#C99A3E] text-[#1B2A4A] ml-auto font-medium" : "bg-[#25365C] border border-[#3A4D73] text-[#F4EFE3]"}`}>
                                            {m.content}
                                        </div>
                                    ))}
                                    {loading && <div className="text-[#9FB0CE] text-sm italic">Thinking…</div>}
                                    {error && <div className="text-red-300 text-sm bg-red-950/40 border border-red-800/50 rounded-md px-3 py-2">{error}</div>}
                                </div>

                                <div className="p-4 border-t border-[#3A4D73] flex gap-2">
                                    <input
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={(e) => e.key === "Enter" && sendMessage()}
                                        placeholder="Type your message…"
                                        className="flex-1 bg-[#25365C] border border-[#3A4D73] rounded-md px-3 py-2.5 text-sm outline-none focus:border-[#C99A3E]"
                                    />
                                    <button onClick={sendMessage} disabled={loading || !input.trim()} className="bg-[#C99A3E] text-[#1B2A4A] rounded-md px-4 font-semibold disabled:opacity-40">Send</button>
                                </div>
                            </div>

                            <div className="w-full md:w-80 flex-shrink-0 p-6 bg-[#16233F]">
                                <h3 className="text-sm font-semibold text-[#C99A3E] mb-3">Attestation Record</h3>
                                {!record ? (
                                    <p className="text-sm text-[#5C6E8F] leading-relaxed">Switch to "Log an attestation" and describe who you're vouching for — the assistant will fill this in live.</p>
                                ) : (
                                    <div className="space-y-3 text-sm">
                                        {[
                                            ["Farmer", record.farmer_name],
                                            ["Community", record.farmer_community],
                                            ["Attestor", record.attestor_name],
                                            ["Role", record.attestor_role],
                                            ["Basis for vouching", record.relationship],
                                            ["Date", record.date],
                                        ].map(([label, value]) => (
                                            <div key={label}>
                                                <div className="text-[#5C6E8F] text-xs uppercase tracking-wide">{label}</div>
                                                <div className="text-[#F4EFE3]">{value || "—"}</div>
                                            </div>
                                        ))}
                                        <div className="pt-2 mt-2 border-t border-[#3A4D73] text-xs text-[#C99A3E]">✓ Record ready for CVK</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
</body>
</html>
